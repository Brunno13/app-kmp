when:
  - event: tag

labels:
  platform: darwin/arm64

steps:
  # =========================================================
  # NOTIFICAÇÃO DE INÍCIO
  # =========================================================
  - name: notify-start
    image: bash

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        set -eu

        TIMESTAMP="$$(TZ=BRT3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · ${CI_REPO_NAME} · Production pipeline started · Tag ${CI_COMMIT_TAG} · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

  # =========================================================
  # FASE 1: QUALITY + BUILD DOS ARTEFATOS
  #
  # Os scripts de Android/iOS consomem:
  #   ci/artifacts.env
  #
  # APP_ENV=production preserva o comportamento histórico
  # do release acionado por tag.
  # =========================================================
  - name: build-artifacts
    image: bash

    environment:
      APP_ENV: "production"

    commands:
      - |
        set -eu

        echo "===== RELEASE BUILD / CONFIG ====="

        CONFIG_FILE="./ci/artifacts.env"

        if [ ! -r "$$CONFIG_FILE" ]; then
          echo "ARTIFACT_CONFIG=FAIL"
          exit 1
        fi

        set -a
        . "$$CONFIG_FILE"
        set +a

        test -n "$$ARTIFACT_BASENAME"

        ANDROID_ARTIFACT="$${ARTIFACT_BASENAME}-production.apk"
        IOS_ARTIFACT="$${ARTIFACT_BASENAME}-ios-production.zip"

        echo "ARTIFACT_CONFIG=PASS"
        echo "ANDROID_ARTIFACT=$$ANDROID_ARTIFACT"
        echo "IOS_ARTIFACT=$$IOS_ARTIFACT"

        echo
        echo "===== PERMISSIONS ====="

        chmod +x ./gradlew
        chmod +x ./scripts/*.sh

        echo
        echo "===== LINT ====="

        ./scripts/lint.sh

        echo
        echo "===== TESTS ====="

        ./scripts/test.sh

        echo
        echo "===== ANDROID PRODUCTION BUILD ====="

        ./scripts/build_android.sh

        echo
        echo "===== IOS PRODUCTION BUILD ====="

        ./scripts/build_ios.sh

        echo
        echo "===== RELEASE ARTIFACTS ====="

        test -s "./$$ANDROID_ARTIFACT"
        test -s "./$$IOS_ARTIFACT"

        ls -lah \
          "./$$ANDROID_ARTIFACT" \
          "./$$IOS_ARTIFACT"

        echo
        echo "===== SHA256 ====="

        shasum -a 256 \
          "./$$ANDROID_ARTIFACT" \
          "./$$IOS_ARTIFACT"

        echo
        echo "RELEASE_BUILD=PASS"

  # =========================================================
  # FASE 2: RELEASE NO GITEA
  # =========================================================
  - name: release-gitea
    image: bash

    environment:
      GITEA_TOKEN:
        from_secret: gitea_token

      GITEA_API_BASE:
        from_secret: gitea_api_base

    commands:
      - |
        set -eu

        echo "===== GITEA RELEASE ====="

        test -n "$$GITEA_TOKEN"
        test -n "$$GITEA_API_BASE"
        test -r ./ci/artifacts.env

        set -a
        . ./ci/artifacts.env
        set +a

        test -n "$$ARTIFACT_BASENAME"

        ANDROID_ARTIFACT="$${ARTIFACT_BASENAME}-production.apk"
        IOS_ARTIFACT="$${ARTIFACT_BASENAME}-ios-production.zip"

        test -s "./$$ANDROID_ARTIFACT"
        test -s "./$$IOS_ARTIFACT"

        # Aceita o secret com ou sem "/" no final.
        GITEA_API_BASE="$${GITEA_API_BASE%/}"

        echo
        echo "===== RELEASE HISTORY ====="

        git config \
          remote.origin.fetch \
          "+refs/heads/*:refs/remotes/origin/*"

        git fetch --all --unshallow \
          || git fetch --all

        git fetch --tags

        PREV_TAG="$$( \
          git describe \
            --tags \
            --abbrev=0 \
            HEAD^ \
            2>/dev/null \
            || true \
        )"

        if [ -z "$$PREV_TAG" ]; then
          CHANGELOG="$$( \
            git log \
              --pretty=format:"- %h %s" \
          )"
        else
          CHANGELOG="$$( \
            git log \
              --pretty=format:"- %h %s" \
              "$$PREV_TAG..HEAD" \
          )"
        fi

        RELEASE_BODY="$$( \
          printf \
            '🚀 Deploy automático multiplataforma Android e iOS (KMP) realizado nativamente pelo agente Apple Silicon.\n\n---\n\n%s' \
            "$$CHANGELOG" \
        )"

        printf '%s\n' \
          "$$RELEASE_BODY" \
          > .release_body.txt

        JSON_PAYLOAD="$$( \
          jq -n \
            --arg tag "${CI_COMMIT_TAG}" \
            --arg name "Versão ${CI_COMMIT_TAG}" \
            --arg body "$$RELEASE_BODY" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body
            }' \
        )"

        echo
        echo "===== CREATE GITEA RELEASE ====="

        RESPONSE="$$( \
          curl \
            --silent \
            --show-error \
            -X POST \
            "$$GITEA_API_BASE/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases" \
            -H "Accept: application/json" \
            -H "Authorization: token $$GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$$JSON_PAYLOAD" \
        )"

        RELEASE_ID="$$( \
          printf '%s' "$$RESPONSE" \
            | jq -r '.id' \
        )"

        if [ "$$RELEASE_ID" = "null" ] || \
           [ -z "$$RELEASE_ID" ]; then

          echo "GITEA_RELEASE_CREATE=FAIL"
          echo "Resposta recebida:"
          printf '%s\n' "$$RESPONSE"

          exit 1
        fi

        echo "GITEA_RELEASE_CREATE=PASS"

        echo
        echo "===== UPLOAD GITEA ARTIFACTS ====="

        curl -fsS \
          -X POST \
          "$$GITEA_API_BASE/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/$$RELEASE_ID/assets?name=$$ANDROID_ARTIFACT" \
          -H "Authorization: token $$GITEA_TOKEN" \
          -F "attachment=@./$$ANDROID_ARTIFACT"

        echo "GITEA_ANDROID_UPLOAD=PASS"

        curl -fsS \
          -X POST \
          "$$GITEA_API_BASE/repos/${CI_REPO_OWNER}/${CI_REPO_NAME}/releases/$$RELEASE_ID/assets?name=$$IOS_ARTIFACT" \
          -H "Authorization: token $$GITEA_TOKEN" \
          -F "attachment=@./$$IOS_ARTIFACT"

        echo "GITEA_IOS_UPLOAD=PASS"

        echo
        echo "============================================================"
        echo " GITEA RELEASE SUMMARY"
        echo "============================================================"
        printf '%-32s %s\n' "Release creation" "PASS"
        printf '%-32s %s\n' "Android artifact" "PASS"
        printf '%-32s %s\n' "iOS artifact" "PASS"
        echo "============================================================"
        echo "GITEA_RELEASE=PASS"

  # =========================================================
  # FASE 3: ESPELHAMENTO PARA O GITHUB
  # =========================================================
  - name: mirror-github
    image: bash

    environment:
      GITHUB_TOKEN:
        from_secret: github_token

    commands:
      - |
        set -eu

        echo "===== GITHUB MIRROR ====="

        test -n "$$GITHUB_TOKEN"

        RELEASE_CONFIG="./ci/release.env"

        if [ ! -r "$$RELEASE_CONFIG" ]; then
          echo "RELEASE_CONFIG=FAIL"
          exit 1
        fi

        set -a
        . "$$RELEASE_CONFIG"
        set +a

        test -n "$$GITHUB_OWNER"

        echo "RELEASE_CONFIG=PASS"

        git config \
          --global \
          --add \
          safe.directory \
          "*"

        git config \
          --global \
          http.postBuffer \
          524288000

        GITHUB_REPO_URL="https://$$GITHUB_TOKEN@github.com/$$GITHUB_OWNER/${CI_REPO_NAME}.git"

        echo
        echo "===== PUSH MAIN ====="

        GIT_TERMINAL_PROMPT=0 \
          git \
            -c credential.helper= \
            push \
            "$$GITHUB_REPO_URL" \
            HEAD:main \
            --force

        echo "GITHUB_MAIN_MIRROR=PASS"

        echo
        echo "===== PUSH TAG ====="

        GIT_TERMINAL_PROMPT=0 \
          git \
            -c credential.helper= \
            push \
            "$$GITHUB_REPO_URL" \
            "${CI_COMMIT_TAG}" \
            --force

        echo "GITHUB_TAG_MIRROR=PASS"

        echo
        echo "GITHUB_MIRROR=PASS"

  # =========================================================
  # FASE 4: RELEASE NO GITHUB
  # =========================================================
  - name: release-github
    image: bash

    environment:
      GITHUB_TOKEN:
        from_secret: github_token

    commands:
      - |
        set -eu

        echo "===== GITHUB RELEASE ====="

        test -n "$$GITHUB_TOKEN"
        test -r ./ci/artifacts.env
        test -r ./ci/release.env

        set -a
        . ./ci/artifacts.env
        . ./ci/release.env
        set +a

        test -n "$$ARTIFACT_BASENAME"
        test -n "$$GITHUB_OWNER"

        ANDROID_ARTIFACT="$${ARTIFACT_BASENAME}-production.apk"
        IOS_ARTIFACT="$${ARTIFACT_BASENAME}-ios-production.zip"

        test -s "./$$ANDROID_ARTIFACT"
        test -s "./$$IOS_ARTIFACT"

        GITHUB_API_URL="https://api.github.com/repos/$$GITHUB_OWNER/${CI_REPO_NAME}/releases"

        if [ -f .release_body.txt ]; then
          RELEASE_BODY="$$(cat .release_body.txt)"
        else
          RELEASE_BODY="🚀 Lançamento automatizado KMP sincronizado a partir do servidor Gitea interno."
        fi

        JSON_PAYLOAD="$$( \
          jq -n \
            --arg tag "${CI_COMMIT_TAG}" \
            --arg name "Versão ${CI_COMMIT_TAG}" \
            --arg body "$$RELEASE_BODY" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body
            }' \
        )"

        echo
        echo "===== CREATE GITHUB RELEASE ====="

        RESPONSE="$$( \
          curl \
            --silent \
            --show-error \
            -X POST \
            "$$GITHUB_API_URL" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $$GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$$JSON_PAYLOAD" \
        )"

        RELEASE_ID="$$( \
          printf '%s' "$$RESPONSE" \
            | jq -r '.id' \
        )"

        if [ "$$RELEASE_ID" = "null" ] || \
           [ -z "$$RELEASE_ID" ]; then

          echo "GITHUB_RELEASE_CREATE=FAIL"
          echo "Resposta recebida:"
          printf '%s\n' "$$RESPONSE"

          exit 1
        fi

        echo "GITHUB_RELEASE_CREATE=PASS"

        GH_UPLOAD_URL="https://uploads.github.com/repos/$$GITHUB_OWNER/${CI_REPO_NAME}/releases/$$RELEASE_ID/assets"

        echo
        echo "===== UPLOAD GITHUB ARTIFACTS ====="

        curl -fsS \
          -X POST \
          "$$GH_UPLOAD_URL?name=$$ANDROID_ARTIFACT" \
          -H "Authorization: Bearer $$GITHUB_TOKEN" \
          -H "Content-Type: application/vnd.android.package-archive" \
          --data-binary "@./$$ANDROID_ARTIFACT"

        echo "GITHUB_ANDROID_UPLOAD=PASS"

        curl -fsS \
          -X POST \
          "$$GH_UPLOAD_URL?name=$$IOS_ARTIFACT" \
          -H "Authorization: Bearer $$GITHUB_TOKEN" \
          -H "Content-Type: application/zip" \
          --data-binary "@./$$IOS_ARTIFACT"

        echo "GITHUB_IOS_UPLOAD=PASS"

        echo
        echo "============================================================"
        echo " RELEASE PIPELINE SUMMARY"
        echo "============================================================"
        printf '%-32s %s\n' "Build Android" "PASS"
        printf '%-32s %s\n' "Build iOS" "PASS"
        printf '%-32s %s\n' "Gitea release" "PASS"
        printf '%-32s %s\n' "GitHub mirror" "PASS"
        printf '%-32s %s\n' "GitHub release" "PASS"
        echo "============================================================"
        echo "RELEASE_PIPELINE=PASS"

  # =========================================================
  # NOTIFICAÇÃO DE SUCESSO
  # =========================================================
  - name: notify-success
    image: bash

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        set -eu

        TIMESTAMP="$$(TZ=BRT3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · ${CI_REPO_NAME} · Production pipeline finished successfully · Tag ${CI_COMMIT_TAG} · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

    when:
      - event: tag
        status: [success]

  # =========================================================
  # NOTIFICAÇÃO DE ERRO
  # =========================================================
  - name: notify-error
    image: bash

    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token

    commands:
      - |
        set -eu

        TIMESTAMP="$$(TZ=BRT3 date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · ${CI_REPO_NAME} · Production pipeline failed · Tag ${CI_COMMIT_TAG} · $${TIMESTAMP}" \
          -F "priority=8" \
          || true

    when:
      - event: tag
        status: [failure]