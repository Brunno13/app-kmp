when:
  - event: manual

labels:
  platform: darwin/arm64

steps:
  - name: ios-runtime-probe
    image: bash
    commands:
      - |
        set -u

        echo "===== SYSTEM ====="
        uname -a
        uname -m
        sw_vers || true

        echo
        echo "===== XCODE ====="
        xcodebuild -version || true

        echo
        echo "===== JAVA ====="
        java -version || true

        echo
        echo "===== ZIP ====="
        command -v zip || true
        zip -v | head -n 2 || true

        echo
        echo "===== CURL ====="
        command -v curl || true
        curl --version | head -n 1 || true

        echo
        echo "===== AWS CLI ====="
        command -v aws || true
        aws --version || true

        echo
        echo "===== PYTHON ====="
        command -v python3 || true
        python3 --version || true

        echo
        echo "===== HOMEBREW ====="
        command -v brew || true

        echo
        echo "===== DOCKER ====="
        command -v docker || true
        docker version --format '{{.Client.Version}}' 2>/dev/null || true

        echo
        echo "IOS_RUNTIME_PROBE=DONE"