when:
  - event: push
    branch: main

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-wake-x86

steps:
  # =========================================================
  # NOTIFICAÇÃO DE INÍCIO
  # =========================================================
  - name: notify-start
    image: bash
    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token
    commands:
      - |
        TIMESTAMP="$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · App-KMP · Android CI started on VM104 · $${TIMESTAMP}" \
          -F "priority=5" \
          || true

  # =========================================================
  # ANDROID/JVM QUALITY + BUILD
  # =========================================================
  - name: android-quality-and-build
    image: app-kmp-android-ci:37-jdk17-v3
    pull: false

    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      ANDROID_SDK_ROOT: /opt/android-sdk-linux
      ANDROID_PLATFORM_DIR: android-37.0
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      ANDROID_ASSEMBLE_DEBUG: "true"

    commands:
      - |
        set -eu

        chmod +x ./gradlew
        chmod +x ./scripts/quality_android.sh

        ./scripts/quality_android.sh

  # =========================================================
  # NOTIFICAÇÕES FINAIS
  # =========================================================
  - name: notify-success
    image: bash
    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token
    commands:
      - |
        TIMESTAMP="$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · App-KMP · Android CI finished successfully on VM104 · $${TIMESTAMP}" \
          -F "priority=5" \
          || true
    when:
      - event: push
        branch: main
        status: [success]

  - name: notify-error
    image: bash
    environment:
      GOTIFY_TOKEN:
        from_secret: gotify_token
    commands:
      - |
        TIMESTAMP="$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          --output /dev/null \
          -X POST \
          "https://gotify.brunnoserver.duckdns.org/message?token=$$GOTIFY_TOKEN" \
          -F "title=WoodpeckerCI" \
          -F "message=WoodpeckerCI · App-KMP · Android CI failed on VM104 · $${TIMESTAMP}" \
          -F "priority=8" \
          || true
    when:
      - event: push
        branch: main
        status: [failure]