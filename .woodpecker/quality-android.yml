when:
  - event: manual

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-wake-x86

steps:
  - name: android-quality
    image: app-kmp-android-ci:35-jdk17-v2
    pull: false

    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      ANDROID_SDK_ROOT: /opt/android-sdk-linux

    commands:
      - |
        set -eu

        echo "===== ANDROID QUALITY / VM104 ====="

        echo
        echo "===== ARCH ====="
        uname -m

        echo
        echo "===== BASE JAVA ====="
        java -version

        echo
        echo "===== INSTALLED JDKS ====="
        ls -lah /usr/lib/jvm

        echo
        echo "===== JAVA 17 ====="
        /usr/lib/jvm/java-17-openjdk-amd64/bin/java -version

        echo
        echo "===== JAVA 21 ====="
        /usr/lib/jvm/java-21-openjdk-amd64/bin/java -version

        echo
        echo "===== ANDROID SDK ====="
        printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME"
        printf 'ANDROID_SDK_ROOT=%s\n' "$ANDROID_SDK_ROOT"
        ls -d "$ANDROID_HOME/platforms/android-35"
        ls -d "$ANDROID_HOME/build-tools/35.0.0"

        echo
        echo "===== GRADLE ====="
        chmod +x ./gradlew
        ./gradlew --version

        echo
        echo "===== GRADLE JAVA TOOLCHAINS ====="

        ./gradlew :shared:javaToolchains \
          || echo "INFO: task javaToolchains indisponivel no modulo shared"

        echo
        echo "===== UNIT TESTS + COVERAGE GATE ====="

        ./gradlew \
          :shared:testAndroidHostTest \
          :shared:jacocoBusinessCoverageReport \
          :shared:jacocoBusinessCoverageVerification \
          --rerun-tasks

        echo
        echo "===== TEST TOTALS ====="

        grep -h '<testsuite ' \
          shared/build/test-results/testAndroidHostTest/TEST-*.xml \
          | sed -E \
              's/.*name="([^"]+)".*tests="([^"]+)".*failures="([^"]+)".*errors="([^"]+)".*/SUITE=\1 TESTS=\2 FAILURES=\3 ERRORS=\4/'

        echo
        echo "===== BUSINESS COVERAGE ROOT COUNTERS ====="

        XML="shared/build/reports/jacoco/jacocoBusinessCoverageReport/jacocoBusinessCoverageReport.xml"

        test -f "$XML"

        for TYPE in INSTRUCTION BRANCH LINE METHOD CLASS; do
          printf '%s: ' "$TYPE"

          grep -o \
            "<counter type=\"$TYPE\" missed=\"[0-9]*\" covered=\"[0-9]*\"/>" \
            "$XML" \
            | tail -n 1
        done

        echo
        echo "===== DETEKT AUTHORED COMMON MAIN ====="

        set +e

        ./gradlew \
          :shared:detektAuthoredCommonMain \
          --rerun-tasks

        DETEKT_COMMON_RC="$?"

        set -e

        echo "DETEKT_COMMON_RC=$DETEKT_COMMON_RC"

        echo
        echo "===== DETEKT AUTHORED ANDROID MAIN ====="

        set +e

        ./gradlew \
          :shared:detektAuthoredAndroidMain \
          --rerun-tasks

        DETEKT_ANDROID_RC="$?"

        set -e

        echo "DETEKT_ANDROID_RC=$DETEKT_ANDROID_RC"

        echo
        echo "===== DETEKT REPORTS ====="

        COMMON_XML="shared/build/reports/detekt/authored-common-main.xml"
        ANDROID_XML="shared/build/reports/detekt/authored-android-main.xml"

        test -f "$COMMON_XML"
        test -f "$ANDROID_XML"

        find shared/build/reports/detekt \
          -maxdepth 1 \
          -type f \
          -printf '%f\n' \
          | sort

        echo
        echo "===== DETEKT FINDING COUNTS ====="

        COMMON_FINDINGS="$(
          grep -c '<error ' "$COMMON_XML" || true
        )"

        ANDROID_FINDINGS="$(
          grep -c '<error ' "$ANDROID_XML" || true
        )"

        echo "DETEKT_COMMON_FINDINGS=$COMMON_FINDINGS"
        echo "DETEKT_ANDROID_FINDINGS=$ANDROID_FINDINGS"

        echo
        echo "===== ANDROID LINT / PRODUCTION DEBUG ====="

        set +e

        ./gradlew \
          :androidApp:lintProductionDebug \
          --rerun-tasks

        ANDROID_LINT_RC="$?"

        set -e

        echo "ANDROID_LINT_RC=$ANDROID_LINT_RC"

        echo
        echo "===== ANDROID LINT REPORT ====="

        LINT_XML="androidApp/build/reports/lint-results-productionDebug.xml"
        LINT_TXT="androidApp/build/reports/lint-results-productionDebug.txt"

        LINT_REPORT_OK=1

        if [ -f "$LINT_XML" ]; then
          echo "ANDROID_LINT_XML=$LINT_XML"
        else
          echo "ERROR: Android Lint XML report not found"
          LINT_REPORT_OK=0
        fi

        if [ -f "$LINT_TXT" ]; then
          echo "ANDROID_LINT_TXT=$LINT_TXT"

          echo
          echo "===== ANDROID LINT TEXT REPORT ====="

          cat "$LINT_TXT"
        else
          echo "INFO: Android Lint text report not found"
        fi

        echo
        echo "===== ANDROID LINT FINDING COUNTS ====="

        LINT_TOTAL=0
        LINT_ERRORS=0
        LINT_FATALS=0
        LINT_WARNINGS=0
        LINT_DEPENDENCY_ADVISORIES=0
        LINT_AGP_ADVISORIES=0
        LINT_NEWER_VERSION_ADVISORIES=0
        LINT_OLD_TARGET_API=0
        LINT_ALLOWED_OLD_TARGET_API=0
        LINT_VERSION_ADVISORIES=0
        ANDROID_TARGET_SDK=""
        ANDROID_TARGET_POLICY="FAIL"
        LINT_ADVISORIES=0
        LINT_ACTIONABLE_WARNINGS=0

        if [ "$LINT_REPORT_OK" -eq 1 ]; then
          LINT_TOTAL="$(
            grep -o 'severity="[^"]*"' "$LINT_XML" \
              | wc -l \
              | tr -d ' '
          )"

          LINT_ERRORS="$(
            grep -c 'severity="Error"' "$LINT_XML" || true
          )"

          LINT_FATALS="$(
            grep -c 'severity="Fatal"' "$LINT_XML" || true
          )"

          LINT_WARNINGS="$(
            grep -c 'severity="Warning"' "$LINT_XML" || true
          )"

          LINT_DEPENDENCY_ADVISORIES="$(
            grep -c 'id="GradleDependency"' "$LINT_XML" || true
          )"

          LINT_AGP_ADVISORIES="$(
            grep -c 'id="AndroidGradlePluginVersion"' "$LINT_XML" || true
          )"

          LINT_NEWER_VERSION_ADVISORIES="$(
            grep -c 'id="NewerVersionAvailable"' "$LINT_XML" || true
          )"

          LINT_OLD_TARGET_API="$(
            grep -c 'id="OldTargetApi"' "$LINT_XML" || true
          )"
        fi

        ANDROID_TARGET_SDK="$(
          sed -n \
            's/^[[:space:]]*android-targetSdk[[:space:]]*=[[:space:]]*"\([0-9][0-9]*\)".*/\1/p' \
            gradle/libs.versions.toml \
            | head -n 1
        )"

        case "$ANDROID_TARGET_SDK" in
          ''|*[!0-9]*)
            ANDROID_TARGET_POLICY="FAIL"
            ;;

          *)
            if [ "$ANDROID_TARGET_SDK" -ge 36 ]; then
              ANDROID_TARGET_POLICY="PASS"
              LINT_ALLOWED_OLD_TARGET_API="$LINT_OLD_TARGET_API"
            else
              ANDROID_TARGET_POLICY="FAIL"
            fi
            ;;
        esac

        LINT_VERSION_ADVISORIES=$((LINT_DEPENDENCY_ADVISORIES + LINT_AGP_ADVISORIES + LINT_NEWER_VERSION_ADVISORIES))
        LINT_ADVISORIES=$((LINT_VERSION_ADVISORIES + LINT_ALLOWED_OLD_TARGET_API))
        LINT_ACTIONABLE_WARNINGS=$((LINT_WARNINGS - LINT_ADVISORIES))

        if [ "$LINT_ACTIONABLE_WARNINGS" -lt 0 ]; then
          LINT_ACTIONABLE_WARNINGS=0
        fi

        echo "ANDROID_LINT_TOTAL=$LINT_TOTAL"
        echo "ANDROID_LINT_ERRORS=$LINT_ERRORS"
        echo "ANDROID_LINT_FATALS=$LINT_FATALS"
        echo "ANDROID_LINT_WARNINGS=$LINT_WARNINGS"
        echo "ANDROID_LINT_DEPENDENCY_ADVISORIES=$LINT_DEPENDENCY_ADVISORIES"
        echo "ANDROID_LINT_AGP_ADVISORIES=$LINT_AGP_ADVISORIES"
        echo "ANDROID_LINT_NEWER_VERSION_ADVISORIES=$LINT_NEWER_VERSION_ADVISORIES"
        echo "ANDROID_LINT_VERSION_ADVISORIES=$LINT_VERSION_ADVISORIES"
        echo "ANDROID_LINT_OLD_TARGET_API=$LINT_OLD_TARGET_API"
        echo "ANDROID_TARGET_SDK=$ANDROID_TARGET_SDK"
        echo "ANDROID_TARGET_POLICY=$ANDROID_TARGET_POLICY"
        echo "ANDROID_LINT_ADVISORIES=$LINT_ADVISORIES"
        echo "ANDROID_LINT_ACTIONABLE_WARNINGS=$LINT_ACTIONABLE_WARNINGS"

        echo
        echo "===== ANDROID LINT ISSUE IDS ====="

        if [ "$LINT_REPORT_OK" -eq 1 ]; then
          grep -o 'id="[^"]*"' "$LINT_XML" \
            | sort \
            | uniq -c \
            || true
        fi

        echo
        echo "===== QUALITY SUMMARY ====="

        echo "UNIT_TESTS=PASS"
        echo "BUSINESS_COVERAGE=PASS"

        DETEKT_GATE="PASS"

        if [ "$DETEKT_COMMON_RC" -eq 0 ] &&
           [ "$COMMON_FINDINGS" -eq 0 ]; then
          echo "DETEKT_COMMON=PASS"
        else
          echo "DETEKT_COMMON=FAIL"
          DETEKT_GATE="FAIL"
        fi

        if [ "$DETEKT_ANDROID_RC" -eq 0 ] &&
           [ "$ANDROID_FINDINGS" -eq 0 ]; then
          echo "DETEKT_ANDROID=PASS"
        else
          echo "DETEKT_ANDROID=FAIL"
          DETEKT_GATE="FAIL"
        fi

        echo "DETEKT_GATE=$DETEKT_GATE"

        ANDROID_LINT_GATE="PASS"

        if [ "$LINT_REPORT_OK" -ne 1 ] ||
           [ "$ANDROID_LINT_RC" -ne 0 ] ||
           [ "$LINT_ERRORS" -ne 0 ] ||
           [ "$LINT_FATALS" -ne 0 ] ||
           [ "$ANDROID_TARGET_POLICY" != "PASS" ] ||
           [ "$LINT_ACTIONABLE_WARNINGS" -ne 0 ]; then
          ANDROID_LINT_GATE="FAIL"
        fi

        echo "ANDROID_LINT_TOTAL=$LINT_TOTAL"
        echo "ANDROID_LINT_ERRORS=$LINT_ERRORS"
        echo "ANDROID_LINT_FATALS=$LINT_FATALS"
        echo "ANDROID_LINT_ACTIONABLE_WARNINGS=$LINT_ACTIONABLE_WARNINGS"
        echo "ANDROID_LINT_DEPENDENCY_ADVISORIES=$LINT_DEPENDENCY_ADVISORIES"
        echo "ANDROID_LINT_AGP_ADVISORIES=$LINT_AGP_ADVISORIES"
        echo "ANDROID_LINT_NEWER_VERSION_ADVISORIES=$LINT_NEWER_VERSION_ADVISORIES"
        echo "ANDROID_LINT_VERSION_ADVISORIES=$LINT_VERSION_ADVISORIES"
        echo "ANDROID_LINT_OLD_TARGET_API=$LINT_OLD_TARGET_API"
        echo "ANDROID_TARGET_SDK=$ANDROID_TARGET_SDK"
        echo "ANDROID_TARGET_POLICY=$ANDROID_TARGET_POLICY"
        echo "ANDROID_LINT_ADVISORIES=$LINT_ADVISORIES"
        echo "ANDROID_LINT_GATE=$ANDROID_LINT_GATE"

        if [ "$DETEKT_GATE" != "PASS" ] ||
           [ "$ANDROID_LINT_GATE" != "PASS" ]; then
          echo
          echo "ANDROID_QUALITY_GATE=FAIL"
          exit 1
        fi

        echo
        echo "ANDROID_QUALITY_GATE=PASS"
