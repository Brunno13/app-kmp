when:
  - event: manual

labels:
  platform: linux/amd64
  role: build-linux

depends_on:
  - security-wake-x86

steps:
  # =========================================================
  # QUALITY GATE
  #
  # Sem BUILD_ANDROID:
  #   executa somente o quality gate.
  #
  # Com BUILD_ANDROID:
  #   BUILD_ANDROID=staging
  #   BUILD_ANDROID=production
  # =========================================================
  - name: android-quality
    image: app-kmp-android-ci:37-jdk17-v3
    pull: false

    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      ANDROID_SDK_ROOT: /opt/android-sdk-linux
      ANDROID_PLATFORM_DIR: android-37.0
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      ANDROID_ASSEMBLE_DEBUG: "false"

    commands:
      - |
        set -eu

        chmod +x ./gradlew
        chmod +x ./scripts/quality_android.sh

        ./scripts/quality_android.sh

        echo
        echo "===== MANUAL BUILD REQUEST ====="

        BUILD_REQUEST="${BUILD_ANDROID:-}"

        case "$BUILD_REQUEST" in
          "")
            echo "ANDROID_MANUAL_REQUEST=QUALITY_ONLY"
            ;;

          staging|production)
            echo "ANDROID_MANUAL_REQUEST=$BUILD_REQUEST"
            ;;

          *)
            echo "ANDROID_MANUAL_REQUEST=INVALID"
            echo "BUILD_ANDROID must be staging or production"
            exit 1
            ;;
        esac

  # =========================================================
  # MANUAL ANDROID RELEASE BUILD
  #
  # Só executa com:
  #   BUILD_ANDROID=staging
  #   BUILD_ANDROID=production
  # =========================================================
  - name: android-release-build
    image: app-kmp-android-ci:37-jdk17-v3
    pull: false

    when:
      - evaluate: 'BUILD_ANDROID == "staging" || BUILD_ANDROID == "production"'

    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      ANDROID_SDK_ROOT: /opt/android-sdk-linux

    commands:
      - |
        set -eu

        echo "===== MANUAL ANDROID RELEASE BUILD ====="

        BUILD_ENV="$BUILD_ANDROID"

        case "$BUILD_ENV" in
          staging|production)
            ;;
          *)
            echo "ANDROID_BUILD_ENV=INVALID"
            exit 1
            ;;
        esac

        echo "ANDROID_BUILD_ENV=$BUILD_ENV"

        chmod +x ./gradlew
        chmod +x ./scripts/build_android.sh

        APP_ENV="$BUILD_ENV" \
          ./scripts/build_android.sh

        # O build_android.sh usa este mesmo arquivo como fonte
        # para o nome do artefato. Aqui apenas reutilizamos a
        # configuração para validar o resultado produzido.
        set -a
        . ./ci/artifacts.env
        set +a

        EXPECTED_ARTIFACT="./$ARTIFACT_BASENAME-$BUILD_ENV.apk"

        if [ ! -s "$EXPECTED_ARTIFACT" ]; then
          echo "ANDROID_RELEASE_ARTIFACT=FAIL"
          echo "Expected APK was not generated."
          exit 1
        fi

        echo
        echo "===== ANDROID RELEASE ARTIFACT ====="

        ls -lh "$EXPECTED_ARTIFACT"

        echo
        echo "===== SHA256 ====="

        sha256sum "$EXPECTED_ARTIFACT"

        echo
        echo "ANDROID_RELEASE_ARTIFACT=PASS"
        echo "ANDROID_RELEASE_BUILD=PASS"

  # =========================================================
  # GARAGE S3 UPLOAD
  #
  # Sensível via Woodpecker secrets:
  #   endpoint
  #   access key
  #   secret key
  #
  # Não sensível via ci/artifacts.env:
  #   region
  #   bucket
  #   android/ios prefixes
  #   artifact basename
  # =========================================================
  - name: android-garage-upload
    image: public.ecr.aws/aws-cli/aws-cli@sha256:f42bf088cb1456ba9e179ce71fdeb22cc46ff64ea1e3aeae8251ff81391f5bb1
    pull: false

    when:
      - evaluate: 'BUILD_ANDROID == "staging" || BUILD_ANDROID == "production"'

    environment:
      GARAGE_ENDPOINT:
        from_secret: garage_app_kmp_endpoint

      AWS_ACCESS_KEY_ID:
        from_secret: garage_app_kmp_access_key

      AWS_SECRET_ACCESS_KEY:
        from_secret: garage_app_kmp_secret_key

      AWS_EC2_METADATA_DISABLED: "true"

    commands:
      - |
        set -eu

        echo "===== GARAGE S3 ANDROID UPLOAD ====="

        BUILD_ENV="$BUILD_ANDROID"
        CONFIG_FILE="./ci/artifacts.env"

        if [ ! -r "$CONFIG_FILE" ]; then
          echo "ARTIFACT_CONFIG=FAIL"
          exit 1
        fi

        set -a
        . "$CONFIG_FILE"
        set +a

        test -n "$GARAGE_ENDPOINT"
        test -n "$AWS_ACCESS_KEY_ID"
        test -n "$AWS_SECRET_ACCESS_KEY"
        test -n "$GARAGE_REGION"
        test -n "$GARAGE_BUCKET"
        test -n "$GARAGE_ANDROID_PREFIX"
        test -n "$ARTIFACT_BASENAME"

        export AWS_DEFAULT_REGION="$GARAGE_REGION"
        export AWS_REGION="$GARAGE_REGION"

        case "$BUILD_ENV" in
          staging|production)
            ;;
          *)
            echo "GARAGE_UPLOAD_ENV=INVALID"
            exit 1
            ;;
        esac

        SOURCE_ARTIFACT="./$ARTIFACT_BASENAME-$BUILD_ENV.apk"

        if [ ! -s "$SOURCE_ARTIFACT" ]; then
          echo "GARAGE_SOURCE_ARTIFACT=FAIL"
          exit 1
        fi

        OBJECT_KEY="$GARAGE_ANDROID_PREFIX/$BUILD_ENV/$ARTIFACT_BASENAME-$BUILD_ENV.apk"

        echo "ARTIFACT_CONFIG=PASS"
        echo "GARAGE_CONFIGURATION=PASS"
        echo "GARAGE_SOURCE_ARTIFACT=PASS"
        echo "ANDROID_BUILD_ENV=$BUILD_ENV"
        echo "GARAGE_OBJECT_KEY=$OBJECT_KEY"

        aws configure set default.s3.addressing_style path

        echo
        echo "===== UPLOAD APK ====="

        aws \
          --endpoint-url "$GARAGE_ENDPOINT" \
          s3 cp \
          "$SOURCE_ARTIFACT" \
          "s3://$GARAGE_BUCKET/$OBJECT_KEY" \
          --content-type "application/vnd.android.package-archive"

        echo "GARAGE_UPLOAD=PASS"

        echo
        echo "===== VERIFY REMOTE OBJECT ====="

        aws \
          --endpoint-url "$GARAGE_ENDPOINT" \
          s3api head-object \
          --bucket "$GARAGE_BUCKET" \
          --key "$OBJECT_KEY" \
          >/tmp/garage-android-head.json

        test -s /tmp/garage-android-head.json

        echo "GARAGE_HEAD_OBJECT=PASS"

        echo
        echo "============================================================"
        echo " ANDROID MANUAL BUILD SUMMARY"
        echo "============================================================"
        printf '%-32s %s\n' "Quality gate" "PASS"
        printf '%-32s %s\n' "Environment" "$BUILD_ENV"
        printf '%-32s %s\n' "Release build" "PASS"
        printf '%-32s %s\n' "APK validation" "PASS"
        printf '%-32s %s\n' "Garage upload" "PASS"
        printf '%-32s %s\n' "Remote verification" "PASS"
        echo "============================================================"
        echo "ANDROID_MANUAL_BUILD=PASS"
